<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Model Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1f22; font-family: system-ui, sans-serif; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(30,31,34,0.9); color: #eee; padding: 14px 16px;
    border-radius: 8px; font-size: 14px; max-width: 300px;
  }
  #panel h1 { font-size: 15px; margin: 0 0 10px; }
  #panel label { display: block; margin-top: 8px; font-size: 12px; color: #aaa; }
  #panel input[type=file] { display: block; margin-top: 4px; font-size: 12px; color: #ddd; width: 100%; }
  #panel button {
    margin-top: 12px; width: 100%; padding: 8px; border: none; border-radius: 5px;
    background: #4d7cff; color: white; font-size: 13px; cursor: pointer;
  }
  #panel button:hover { background: #3a63d9; }
  #status { margin-top: 10px; font-size: 12px; color: #8f8; min-height: 16px; }
  #hint { margin-top: 10px; font-size: 11px; color: #888; line-height: 1.4; }
  canvas { display: block; }
</style>
</head>
<body>

<div id="panel">
  <h1>3D Model Viewer</h1>
  <label>Model (.obj)</label>
  <input type="file" id="objFile" accept=".obj">
  <label>Material (.mtl) — optional</label>
  <input type="file" id="mtlFile" accept=".mtl">
  <label>Texture image — optional (only needed if the .mtl can't find it)</label>
  <input type="file" id="texFile" accept="image/*">
  <button id="loadBtn">Load model</button>
  <div id="status"></div>
  <div id="hint">Select the .obj, .mtl, and texture PNG produced by main.py (they're written next to each other in the output folder). Drag to orbit, scroll to zoom.</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1f22);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(1.5, 1.2, 1.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dir1 = new THREE.DirectionalLight(0xffffff, 0.8);
dir1.position.set(3, 5, 2);
scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
dir2.position.set(-3, -2, -4);
scene.add(dir2);

const grid = new THREE.GridHelper(4, 20, 0x444444, 0x2a2a2a);
scene.add(grid);

let currentModel = null;
const statusEl = document.getElementById('status');

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.style.color = isError ? '#f88' : '#8f8';
}

function frameObject(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  object.position.sub(center); // center at origin

  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 1.8;
  camera.position.set(dist, dist * 0.8, dist);
  camera.near = maxDim / 100;
  camera.far = maxDim * 50;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

async function loadModel() {
  const objInput = document.getElementById('objFile');
  const mtlInput = document.getElementById('mtlFile');
  const texInput = document.getElementById('texFile');

  const objFile = objInput.files[0];
  if (!objFile) {
    setStatus('Choose a .obj file first.', true);
    return;
  }

  setStatus('Loading...');

  if (currentModel) {
    scene.remove(currentModel);
    currentModel = null;
  }

  const objUrl = URL.createObjectURL(objFile);

  try {
    let materials = null;

    if (mtlInput.files[0]) {
      const mtlUrl = URL.createObjectURL(mtlInput.files[0]);
      const mtlText = await (await fetch(mtlUrl)).text();

      const mtlLoader = new MTLLoader();

      // If a texture file was explicitly provided, redirect texture lookups to it.
      if (texInput.files[0]) {
        const texUrl = URL.createObjectURL(texInput.files[0]);
        const origLoad = mtlLoader.load.bind(mtlLoader);
        materials = mtlLoader.parse(mtlText, '');
        materials.preload();
        for (const key in materials.materials) {
          const mat = materials.materials[key];
          if (mat.map) {
            mat.map = new THREE.TextureLoader().load(texUrl);
          }
        }
      } else {
        materials = mtlLoader.parse(mtlText, '');
        materials.preload();
      }
    }

    const objLoader = new OBJLoader();
    if (materials) objLoader.setMaterials(materials);

    const objText = await (await fetch(objUrl)).text();
    const object = objLoader.parse(objText);

    if (!materials) {
      object.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({ color: 0x7fa8ff, flatShading: false });
        }
      });
    }

    scene.add(object);
    currentModel = object;
    frameObject(object);
    setStatus('Loaded ' + objFile.name);
  } catch (err) {
    console.error(err);
    setStatus('Failed to load: ' + err.message, true);
  }
}

document.getElementById('loadBtn').addEventListener('click', loadModel);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
